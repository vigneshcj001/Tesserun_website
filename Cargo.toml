[package]
name = "tesserun-website"
version = "1.2.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "KeyboardEvent"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
